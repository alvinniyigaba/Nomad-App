name: One-off — void Morris's seed savings, add his Prudential plan

# Manual sheet sync requested by the user in-session, same treatment Joan
# and Juliet got. Morris (username munezero) has logged in and has been
# seeing seed-fixture balances: Emergency UGX 40,000 and Motorbike fund
# UGX 161,120, both identical to the local dev database's seed-fixture
# data (the same pattern Joan's and Juliet's turned out to be). His sheet
# ("Munezero Mugisha Morris") has no real savings rows — only the
# template's EXAMPLE ROW, which is deliberately not posted. So both
# balances are voided with reversing withdrawals (append-only, same as
# every other correction), idempotency-keyed.
#
# His sheet's Investments tab has one row: Prudential, a regular-premium
# plan he holds outside Nomad (Key: External). Entered as an external
# holding with the premiums paid to date (15 x 300,000 through Aug 2026)
# as its balance; the Premium Plans tab supplies the term and end
# estimate. The holdings POST is a plain insert, so this checks for an
# existing Prudential row first and skips rather than duplicating it.
# provider_name matches the sheet's vehicle name, so a later
# sync-investments run updates this same row instead of adding a second.
#
# Runs on push for the same reason as the other one-off workflows in this
# repo's history: this sandbox's egress policy blocks direct POST calls to
# the Vercel domain, and workflow_dispatch isn't triggerable by this
# session's token. Requires the ADMIN_TOKEN repo secret. Safe to delete
# this workflow file once it has run successfully.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-morris-savings-prudential.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Read Morris's accounts and holdings before
        run: |
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=munezero&token=${{ secrets.ADMIN_TOKEN }}"
          echo
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=external-holdings&username=munezero&token=${{ secrets.ADMIN_TOKEN }}"

      - name: Void seed-fixture savings balances
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST "https://nomad-app-hntl.vercel.app/api/admin?resource=post-entries&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "entries": [
                {"idempotencyKey":"munezero-emergency-reset-2026-09-29","date":"2026-09-29","owner":"munezero","accountName":"Emergency","contributor":"munezero","type":"withdrawal","amountStr":"40000","memo":"Seed-data correction: clearing old balance"},
                {"idempotencyKey":"munezero-motorbike-reset-2026-09-29","date":"2026-09-29","owner":"munezero","accountName":"Motorbike fund","contributor":"munezero","type":"withdrawal","amountStr":"161120","memo":"Seed-data correction: clearing old balance"}
              ]
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Void failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors":\[\]' ; then
            echo "Both voids posted cleanly."
          else
            echo "::error::Some entries had errors — $BODY"
            exit 1
          fi

      - name: Add Prudential external holding (skip if it already exists)
        run: |
          EXISTING=$(curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=external-holdings&username=munezero&token=${{ secrets.ADMIN_TOKEN }}")
          if echo "$EXISTING" | grep -q '"provider_name":"Prudential"'; then
            echo "Prudential holding already exists for munezero — skipping insert."
            exit 0
          fi
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST "https://nomad-app-hntl.vercel.app/api/admin?resource=external-holdings&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "username": "munezero",
              "providerName": "Prudential",
              "productType": "investment",
              "managedBy": "external",
              "status": "active",
              "balanceMinor": 450000000,
              "termMonths": 60,
              "maturityDate": "2030-06-13",
              "investmentCurrency": "UGX",
              "notes": "Regular-premium plan: UGX 300,000 monthly on the 13th, 13 Jun 2025 to 13 Jun 2030 (60 premiums). Value shown is premiums paid to date (15, through Aug 2026). Est. value at end: UGX 17,476,864."
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Holding insert failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi

      - name: Confirm final state
        run: |
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=munezero&token=${{ secrets.ADMIN_TOKEN }}"
          echo
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=external-holdings&username=munezero&token=${{ secrets.ADMIN_TOKEN }}"
