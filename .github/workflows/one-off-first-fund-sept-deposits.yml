name: One-off — post Our First Fund September deposits

# Manual sheet sync requested by the user in-session: both members of the
# "Our First Fund" group goal added a September row to their personal
# sheets — niyigaba UGX 75,000 on 2026-09-26 ("September") and Kirabo
# (username hisbabe) UGX 75,000 on 2026-09-29 ("September Deposit").
# Kirabo's earlier 2026-09-02 row (125,000) is deliberately NOT included:
# it was posted directly to the ledger already. niyigaba's placeholder
# "EXAMPLE ROW" (Business capital, 20,000) is also excluded.
# Group deposits carry no owner — the contributor is who put the money in,
# which is what the per-member share is derived from. Posted via
# resource=post-entries with stable idempotency keys so a retry can never
# double-post. Pre-check confirmed the fund was still at 1,050,000.
# Runs on push for the same reason as the other one-off workflows in this
# repo's history: this sandbox's egress policy blocks direct POST calls to
# the Vercel domain, and workflow_dispatch isn't triggerable by this
# session's token. Requires the ADMIN_TOKEN repo secret. Safe to delete
# this workflow file once it has run successfully.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-first-fund-sept-deposits.yml'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Read the fund before
        run: curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=niyigaba&token=${{ secrets.ADMIN_TOKEN }}"

      - name: Post both September deposits
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST "https://nomad-app-hntl.vercel.app/api/admin?resource=post-entries&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "entries": [
                {"idempotencyKey":"niyigaba-deposit-2026-09-26-75000","date":"2026-09-26","owner":"","accountName":"Our First Fund","contributor":"niyigaba","type":"deposit","amountStr":"75000","memo":"September"},
                {"idempotencyKey":"kirabo-deposit-2026-09-29-75000","date":"2026-09-29","owner":"","accountName":"Our First Fund","contributor":"hisbabe","type":"deposit","amountStr":"75000","memo":"September Deposit"}
              ]
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post deposits failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors":\[\]' ; then
            echo "Entries posted cleanly."
          else
            echo "::error::Some entries had errors — $BODY"
            exit 1
          fi

      - name: Confirm final balance
        run: curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=niyigaba&token=${{ secrets.ADMIN_TOKEN }}"
