name: One-off — rename Juliet's goal to General and reload with real statement

# Manual, one-time data correction requested by the user in-session:
# - Renames juliet's individual goal from "Rent deposit" to "General".
# - Voids its old UGX 52,000 balance with a reversing withdrawal (memo
#   notes it's a correction, not a real withdrawal) — same append-only
#   approach used everywhere else in the ledger, never an UPDATE/DELETE
#   of a posted entry.
# - Posts the 5 real transactions from Juliet's statement (organized into
#   the savings-sheet format earlier this session), backdated to when
#   each actually happened via post-entries' createdAt override.
# Runs on push for the same reason as the other one-off workflows this
# session: this sandbox's egress policy blocks direct POST/PATCH calls to
# the Vercel domain, and workflow_dispatch isn't triggerable by this
# session's token. Requires the ADMIN_TOKEN repo secret. Safe to delete
# this workflow file once it has run successfully.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-juliet-general-reset.yml'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Read juliet's accounts before
        run: |
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=juliet&token=${{ secrets.ADMIN_TOKEN }}"

      - name: Rename "Rent deposit" to "General"
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X PATCH "https://nomad-app-hntl.vercel.app/api/admin?resource=rename-account&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"id": "6b180643-118d-4bbe-b51b-c3aa6dd9e628", "name": "General"}')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Rename failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi

      - name: Void old balance and post the real statement
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST "https://nomad-app-hntl.vercel.app/api/admin?resource=post-entries&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "entries": [
                {"idempotencyKey":"juliet-general-reset-2026-09-02","date":"2026-09-02","owner":"juliet","accountName":"General","contributor":"juliet","type":"withdrawal","amountStr":"52000","memo":"Seed-data correction: clearing old balance before loading real statement"},
                {"idempotencyKey":"juliet-general-2026-01-01-bf","date":"2026-01-01","owner":"juliet","accountName":"General","contributor":"juliet","type":"deposit","amountStr":"1875000","memo":"Balance brought forward"},
                {"idempotencyKey":"juliet-general-2026-03-04-feb","date":"2026-03-04","owner":"juliet","accountName":"General","contributor":"juliet","type":"deposit","amountStr":"125000","memo":"February deposit"},
                {"idempotencyKey":"juliet-general-2026-04-01-mar","date":"2026-04-01","owner":"juliet","accountName":"General","contributor":"juliet","type":"deposit","amountStr":"125000","memo":"March deposit"},
                {"idempotencyKey":"juliet-general-2026-05-17-apr-may","date":"2026-05-17","owner":"juliet","accountName":"General","contributor":"juliet","type":"deposit","amountStr":"250000","memo":"April & May deposit"},
                {"idempotencyKey":"juliet-general-2026-08-14-aug","date":"2026-08-14","owner":"juliet","accountName":"General","contributor":"juliet","type":"deposit","amountStr":"125000","memo":"August deposit"}
              ]
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post entries failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors":\[\]' ; then
            echo "All entries posted cleanly."
          else
            echo "::error::Some entries had errors — $BODY"
            exit 1
          fi

      - name: Confirm final balance
        run: |
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=juliet&token=${{ secrets.ADMIN_TOKEN }}"
