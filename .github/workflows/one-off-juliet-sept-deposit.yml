name: One-off — post Juliet's September deposit

# Manual sheet sync requested by the user in-session: Juliet's personal
# sheet ("Nanyonjo Juliet") got a new row — UGX 250,000 on 2026-09-13,
# memo "June&July" (a late gap-fill; her August deposit was already
# posted on 2026-08-14). Posted via resource=post-entries with a stable
# idempotency key so a retry can never double-post. Pre-check confirmed
# her General balance was still 2,500,000 — exactly the sum of the five
# earlier sheet rows — so this row hadn't already landed.
# Runs on push for the same reason as the other one-off workflows in this
# repo's history: this sandbox's egress policy blocks direct POST calls to
# the Vercel domain, and workflow_dispatch isn't triggerable by this
# session's token. Requires the ADMIN_TOKEN repo secret. Safe to delete
# this workflow file once it has run successfully.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-juliet-sept-deposit.yml'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Read Juliet's balance before
        run: curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=juliet&token=${{ secrets.ADMIN_TOKEN }}"

      - name: Post Juliet's September deposit
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST "https://nomad-app-hntl.vercel.app/api/admin?resource=post-entries&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "entries": [{
                "idempotencyKey": "juliet-general-2026-09-13-jun-jul",
                "date": "2026-09-13",
                "owner": "juliet",
                "accountName": "General",
                "contributor": "juliet",
                "type": "deposit",
                "amountStr": "250000",
                "memo": "June & July"
              }]
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post deposit failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors":\[\]' ; then
            echo "Entry posted cleanly."
          else
            echo "::error::Entry had errors — $BODY"
            exit 1
          fi

      - name: Confirm final balance
        run: curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=juliet&token=${{ secrets.ADMIN_TOKEN }}"
