name: One-off — zero Juliet's Emergency, reload Joan's General goal

# Manual, one-time data corrections requested by the user in-session:
# 1. Void Juliet's UGX 18,000 "Emergency" liquid balance (seed-fixture
#    data) with a reversing withdrawal.
# 2. Same treatment as Juliet's goal, applied to Joan: rename her
#    "Business capital" goal to "General", void its old UGX 946,620
#    seed-fixture balance, and post the 7 real transactions from her
#    Google Sheet ("Nanyonga Joan"), backdated to when each happened.
# All via existing admin resources (update-account, post-entries), each
# ledger entry idempotency-keyed so a retry can't double-post.
# Runs on push for the same reason as the other one-off workflows this
# session: this sandbox's egress policy blocks direct POST/PATCH calls to
# the Vercel domain, and workflow_dispatch isn't triggerable by this
# session's token. Requires the ADMIN_TOKEN repo secret. Safe to delete
# this workflow file once it has run successfully.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-juliet-emergency-joan-general.yml'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Read Juliet and Joan's accounts before
        run: |
          echo "juliet:"
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=juliet&token=${{ secrets.ADMIN_TOKEN }}"
          echo
          echo "joan:"
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=joan&token=${{ secrets.ADMIN_TOKEN }}"

      - name: Rename Joan's "Business capital" to "General"
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X PATCH "https://nomad-app-hntl.vercel.app/api/admin?resource=update-account&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"id": "4adbb0d0-a5e6-4455-8c50-cb6791a36e7a", "name": "General"}')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Rename failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi

      - name: Void old balances and post Joan's real statement
        run: |
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST "https://nomad-app-hntl.vercel.app/api/admin?resource=post-entries&token=${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "entries": [
                {"idempotencyKey":"juliet-emergency-reset-2026-09-02","date":"2026-09-02","owner":"juliet","accountName":"Emergency","contributor":"juliet","type":"withdrawal","amountStr":"18000","memo":"Seed-data correction: clearing old balance"},
                {"idempotencyKey":"joan-general-reset-2026-09-02","date":"2026-09-02","owner":"joan","accountName":"General","contributor":"joan","type":"withdrawal","amountStr":"946620","memo":"Seed-data correction: clearing old balance before loading real statement"},
                {"idempotencyKey":"joan-general-2026-01-01-bf","date":"2026-01-01","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"750000","memo":"Balance brought forward"},
                {"idempotencyKey":"joan-general-2026-01-26-jan","date":"2026-01-26","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"250000","memo":"January deposit"},
                {"idempotencyKey":"joan-general-2026-02-28-feb","date":"2026-02-28","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"250000","memo":"February deposit"},
                {"idempotencyKey":"joan-general-2026-03-30-mar","date":"2026-03-30","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"250000","memo":"March deposit"},
                {"idempotencyKey":"joan-general-2026-04-29-apr","date":"2026-04-29","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"250000","memo":"April deposit"},
                {"idempotencyKey":"joan-general-2026-05-30-may","date":"2026-05-30","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"250000","memo":"May deposit"},
                {"idempotencyKey":"joan-general-2026-07-19-jun-jul","date":"2026-07-19","owner":"joan","accountName":"General","contributor":"joan","type":"deposit","amountStr":"400000","memo":"June & July deposit"}
              ]
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Post entries failed with HTTP $HTTP_STATUS — $BODY"
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors":\[\]' ; then
            echo "All entries posted cleanly."
          else
            echo "::error::Some entries had errors — $BODY"
            exit 1
          fi

      - name: Confirm final balances
        run: |
          echo "juliet:"
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=juliet&token=${{ secrets.ADMIN_TOKEN }}"
          echo
          echo "joan:"
          curl -s "https://nomad-app-hntl.vercel.app/api/admin?resource=accounts&username=joan&token=${{ secrets.ADMIN_TOKEN }}"
